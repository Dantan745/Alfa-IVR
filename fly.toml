app = "alfa-koshelek-cr"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "alfa_data"
  destination = "/data"
