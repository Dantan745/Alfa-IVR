# Локальный Postgres. Пользователь, база и пароль alfa, порт 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa
    ports:
      - "5432:5432"
    volumes:
      - alfa_pg:/var/lib/postgresql/data

volumes:
  alfa_pg:
